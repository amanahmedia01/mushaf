<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14503f">
<link rel="icon" href="ikon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="ikon/apple-touch-icon.png">
<title>Catatan Pembaca &middot; Mushaf Al-Qubba</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3efe6; color: #23201a;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  .wadah { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #14503f; color: #fff; padding: 14px 16px calc(14px + env(safe-area-inset-top));
    padding-top: calc(14px + env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5;
    box-shadow: 0 2px 10px rgba(20,40,30,.18); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 3px 0 0; font-size: 12.5px; opacity: .88; }
  .tautan-mushaf { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 700; color: #14503f; background: #e6f0eb;
    border-radius: 999px; text-decoration: none; }
  main { flex: 1 1 auto; padding: 14px; }
  .saring { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip { min-height: 38px; padding: 0 13px; font: inherit; font-size: 13px; font-weight: 700;
    color: #14503f; background: #fff; border: 1px solid #ded6c6; border-radius: 999px; cursor: pointer; }
  .chip.aktif { background: #14503f; color: #fff; border-color: #14503f; }
  .cari { width: 100%; margin-bottom: 12px; padding: 11px 13px; font: inherit; font-size: 14px;
    background: #fff; border: 1px solid #ded6c6; border-radius: 12px; }
  .ringkas { font-size: 12.5px; color: #6b6152; margin: 0 0 10px; }
  .kartu { background: #fff; border: 1px solid #e0d9c9; border-radius: 13px; padding: 13px 14px;
    margin-bottom: 10px; box-shadow: 0 1px 6px rgba(60,45,20,.05); }
  .kartu-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .label { font-size: 11.5px; font-weight: 700; color: #14503f; background: #e6f0eb; padding: 3px 9px; border-radius: 999px; }
  .label.koreksi { color: #8a2d00; background: #ffe9dd; }
  .label.cerita { color: #14435a; background: #e2f1f7; }
  .label.pengalaman { color: #14503f; background: #e6f0eb; }
  .waktu { font-size: 11.5px; color: #8a7f6d; }
  .penulis { font-size: 12.5px; color: #6b6152; margin-top: 6px; }
  .ayat { margin-top: 6px; font-size: 12.5px; color: #14503f; font-style: italic; }
  .isi { margin-top: 7px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .kaki { display: flex; align-items: center; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .buka { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; font-size: 12.5px;
    font-weight: 700; color: #fff; background: #14503f; border-radius: 999px; text-decoration: none; }
  .halaman { font-size: 12px; color: #8a7f6d; }
  .pesan-kosong, .pesan-galat { background: #fff; border: 1px dashed #ded6c6; border-radius: 13px;
    padding: 22px 16px; text-align: center; font-size: 13.5px; color: #6b6152; }
  .muat-lagi { width: 100%; margin-top: 6px; min-height: 46px; font: inherit; font-size: 14px;
    font-weight: 700; color: #14503f; background: #fff; border: 1px solid #ded6c6; border-radius: 13px; cursor: pointer; }
  footer { padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); text-align: center;
    font-size: 12px; color: #8a7f6d; }
  footer a { color: #14503f; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e8e6e1; }
    .kartu, .chip, .cari, .muat-lagi, .pesan-kosong, .pesan-galat { background: #1e2126; border-color: #2f343b; color: #e8e6e1; }
    .chip.aktif { background: #1f6b52; border-color: #1f6b52; color: #fff; }
    .isi { color: #e8e6e1; }
    .waktu, .penulis, .ringkas, .halaman, footer { color: #9aa0a6; }
  }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <h1>&#128220; Catatan Pembaca</h1>
    <p>Cerita, koreksi, dan pengalaman pembaca Mushaf Al-Qubba &mdash; dikirim dari halaman mushaf dan tersimpan di server utama.</p>
    <a class="tautan-mushaf" href="daftar-halaman.html">&#128214; Buka mushaf</a>
  </header>
  <main>
    <div class="saring" id="saring"></div>
    <input type="search" class="cari" id="cari" placeholder="Cari isi catatan, nama, atau nomor halaman&hellip;">
    <p class="ringkas" id="ringkas">Memuat catatan&hellip;</p>
    <div id="daftar"></div>
    <button type="button" class="muat-lagi" id="muatLagi" hidden>Muat lagi</button>
  </main>
  <footer>
    Catatan ditulis dari halaman mushaf (tombol &#128221;). <a href="daftar-halaman.html">Mulai membaca</a>.<br>
    Nama &amp; kontak pengirim tidak ditampilkan di halaman ini.
  </footer>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  var JENIS = [
    { nilai: '', label: 'Semua' },
    { nilai: 'cerita', label: 'Cerita' },
    { nilai: 'koreksi', label: 'Koreksi' },
    { nilai: 'pengalaman', label: 'Pengalaman' },
    { nilai: 'lainnya', label: 'Lainnya' }
  ];
  var PER_HALAMAN = 20;
  var semua = [];
  var saringJenis = '';
  var kunciCari = '';
  var terlihat = PER_HALAMAN;

  var elSaring = document.getElementById('saring');
  var elCari = document.getElementById('cari');
  var elRingkas = document.getElementById('ringkas');
  var elDaftar = document.getElementById('daftar');
  var elMuat = document.getElementById('muatLagi');

  function aman(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function tanggal(iso) {
    var t = Date.parse(iso);
    if (!t) { return ''; }
    try {
      return new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function kartu(c) {
    var jenis = ['cerita', 'koreksi', 'pengalaman', 'lainnya'].indexOf(c.jenis) >= 0 ? c.jenis : 'lainnya';
    var nama = (c.nama || '').trim();
    var ayat = c.ayat && c.ayat.surat ? ('Surat ' + c.ayat.surat + ' \u00b7 Ayat ' + c.ayat.ayat) : '';
    var berkas = (c.berkas || '').replace(/^\/+/, '');
    var tautan = berkas ? (berkas + (c.ayat && c.ayat.surat ? ('#juz' + c.juz + 'halaman' + c.halaman + 'surat' + c.ayat.surat + 'ayat' + c.ayat.ayat + 'baris' + (c.ayat.baris || 1)) : '')) : '';
    return '<article class="kartu">' +
      '<div class="kartu-kepala"><span class="label ' + jenis + '">' + aman(jenis.charAt(0).toUpperCase() + jenis.slice(1)) + '</span>' +
      '<span class="waktu">' + aman(tanggal(c.diterima)) + '</span></div>' +
      '<div class="penulis">' + (nama ? ('oleh ' + aman(nama)) : 'oleh Anonim') + '</div>' +
      (ayat ? ('<div class="ayat">' + aman(ayat) + (c.ayat.kata ? (' \u2014 \u00ab' + aman(c.ayat.kata) + '\u00bb') : '') + '</div>') : '') +
      '<div class="isi">' + aman(c.isi) + '</div>' +
      '<div class="kaki">' + (tautan ? ('<a class="buka" href="' + aman(tautan) + '">Buka halaman ini</a>') : '') +
      '<span class="halaman">Juz ' + aman(c.juz) + ' \u00b7 Halaman ' + aman(c.halaman) + '</span></div>' +
      '</article>';
  }

  function tersaring() {
    var k = kunciCari.trim().toLowerCase();
    return semua.filter(function (c) {
      if (saringJenis && c.jenis !== saringJenis) { return false; }
      if (!k) { return true; }
      var gabung = ((c.isi || '') + ' ' + (c.nama || '') + ' ' + (c.halaman || '') + ' ' + (c.juz || '') + ' ' + (c.jenis || '')).toLowerCase();
      return gabung.indexOf(k) >= 0;
    });
  }

  function gambar() {
    var hasil = tersaring().slice().reverse();
    var tampil = hasil.slice(0, terlihat);
    if (!semua.length) {
      elDaftar.innerHTML = '<p class="pesan-kosong">Belum ada catatan yang dikirim. Jadilah yang pertama: buka mushaf, tekan tombol &#128221;, lalu kirim catatan Anda.</p>';
    } else if (!hasil.length) {
      elDaftar.innerHTML = '<p class="pesan-kosong">Tidak ada catatan yang cocok dengan pencarian.</p>';
    } else {
      elDaftar.innerHTML = tampil.map(kartu).join('');
    }
    elRingkas.textContent = semua.length
      ? (hasil.length + ' dari ' + semua.length + ' catatan' + (saringJenis ? ' \u00b7 jenis: ' + saringJenis : '') + (kunciCari ? ' \u00b7 pencarian: "' + kunciCari + '"' : ''))
      : 'Belum ada catatan.';
    elMuat.hidden = !(hasil.length > terlihat);
  }

  JENIS.forEach(function (j) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (j.nilai === '' ? ' aktif' : '');
    b.textContent = j.label;
    b.addEventListener('click', function () {
      saringJenis = j.nilai;
      terlihat = PER_HALAMAN;
      [].forEach.call(elSaring.children, function (x) { x.classList.toggle('aktif', x === b); });
      gambar();
    });
    elSaring.appendChild(b);
  });

  elCari.addEventListener('input', function () { kunciCari = elCari.value || ''; terlihat = PER_HALAMAN; gambar(); });
  elMuat.addEventListener('click', function () { terlihat += PER_HALAMAN * 2; gambar(); });

  fetch('catatan.php?publik=1&batas=200', { headers: { 'Accept': 'application/json' } })
    .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) { throw new Error('balasan tidak sah'); }
      semua = j.catatan || [];
      gambar();
    })
    .catch(function (e) {
      elRingkas.textContent = 'Gagal memuat catatan.';
      elDaftar.innerHTML = '<p class="pesan-galat">Catatan belum bisa dimuat (' + aman(e && e.message ? e.message : e) +
        '). Periksa sambungan internet lalu muat ulang halaman ini.</p>';
    });
</script>
</body>
</html>
